name: Focused native attachment flow
on:
  workflow_dispatch:
  push:
    branches: [codex/attachment-state-safety-20261011]
permissions:
  contents: read
jobs:
  attachment-flow:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fetch pinned main for the negative control
        run: git fetch --depth=1 origin 654be0d7c65f4e76f8642f1cddf0ee7a4725c0a3
      - name: Reproduce pinned main active-download navigation
        shell: pwsh
        run: ./scripts/test-windows-attachment-flow.ps1 -BaselineNavigation
