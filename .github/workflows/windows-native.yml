name: Windows native candidate
on:
  workflow_dispatch:
  push:
    branches: [codex/native-migration]
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Lock Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Compile WinUI candidate
        shell: pwsh
        run: ./scripts/build-windows-native.ps1 -CompileOnly
      - name: Build and inspect native package without Node
        shell: pwsh
        run: ./scripts/build-windows-native.ps1 -Zip
      - name: Native fixture walkthrough
        shell: pwsh
        run: ./scripts/test-windows-native.ps1 -UiSmoke
      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winui-candidate-${{ github.sha }}
          path: |
            build/windows-native/artifacts/*
            build/windows-native/*evidence*.json
            test-results/windows-native-*.json
          if-no-files-found: ignore
          retention-days: 3
  historical-upgrade:
    needs: native
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 7ab30cbb3e496118513a98f8211ec66481e282c4
          path: .compatibility/beta16
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: .compatibility/beta16
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: winui-candidate-${{ github.sha }}
          path: candidate-artifacts
      - name: Fixed historical installer to actual WinUI candidate
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem candidate-artifacts -Recurse -Filter '*-windows-x64.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one native candidate archive.' }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath candidate
          node scripts/test-rust-upgrade.js --candidate=candidate/'Morrow Mail-win32-x64' --compatibility-root=.compatibility/beta16
