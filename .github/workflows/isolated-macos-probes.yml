name: Isolated macOS fixture diagnostics
on:
  push:
    branches: ['test/native-macos-isolated-20261015']
permissions:
  contents: read
jobs:
  review-lifecycle:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check complete review workspace with explicit AppKit loop
        run: python3 -B scripts/test-macos-review-workspace.py
  row-projection:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read rejected row projection in the explicit AppKit loop
        run: python3 -B scripts/run-isolated-macos-probes.py --probe row --mode appkit --output "$RUNNER_TEMP/morrow-isolated-row"
