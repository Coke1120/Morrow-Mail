name: Isolated macOS fixture diagnostics
on:
  push:
    branches: ['test/native-macos-isolated-20261015']
permissions:
  contents: read
jobs:
  menu-lifecycle:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compare minimal native menu entry points
        run: python3 -B scripts/run-isolated-macos-probes.py --probe menu --output "$RUNNER_TEMP/morrow-isolated-menu"
  row-projection:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compare minimal native row projection entry points
        run: python3 -B scripts/run-isolated-macos-probes.py --probe row --output "$RUNNER_TEMP/morrow-isolated-row"
