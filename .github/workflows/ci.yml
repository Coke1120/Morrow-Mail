name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: |
          shopt -s nullglob globstar
          files=(host/**/*.js shared/**/*.js scripts/*.js)
          test ${#files[@]} -gt 0
          for f in "${files[@]}"; do node --check "$f"; done
