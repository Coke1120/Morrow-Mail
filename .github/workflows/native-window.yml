name: Desktop regression checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  window:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compile and run isolated native window checks
        run: |
          swiftc -D MORROW_WINDOW_CHECKS -parse-as-library macos/Sources/MorrowMail/Models.swift macos/Sources/MorrowMail/AppModel.swift macos/Sources/MorrowMail/MorrowMailApp.swift macos/Checks/WindowAssertions.swift -o "$RUNNER_TEMP/window-checks"
          "$RUNNER_TEMP/window-checks"
  settings:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check native settings and persistence
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          cargo test --manifest-path rust/Cargo.toml --locked --test storage --test mail_service
          if ($LASTEXITCODE -ne 0) { throw 'Native settings/storage contracts failed.' }
