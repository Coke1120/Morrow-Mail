name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: morrow-release
  cancel-in-progress: false

jobs:
  windows:
    # windows-latest is Windows Server 2025 (VS 18). node-gyp 9.4.1 cannot
    # detect that install, so the better-sqlite3 source build fails.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Presence only: Windows never receives the release-signing private key.
      # The committed legacy public root is fixed; a missing secret blocks publication.
      - name: Validate release source and signing prerequisites
        env:
          SIGNING_KEY_AVAILABLE: ${{ secrets.MORROW_UPDATE_SIGNING_KEY != '' }}
        run: node scripts/release-preflight.js
      - run: npm ci
      - run: npm run check
      - name: Bake Google Desktop OAuth client
        shell: bash
        env:
          GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
        run: node scripts/bake-google-desktop-oauth.js
      - name: Build unsigned Windows x64 without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -- --publish never
      - name: Stage Windows assets and provenance
        run: node scripts/prepare-release-assets.js --platform windows --output staging/release-windows
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: staging/release-windows/
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate release source and signing prerequisites
        env:
          SIGNING_KEY_AVAILABLE: ${{ secrets.MORROW_UPDATE_SIGNING_KEY != '' }}
        run: node scripts/release-preflight.js
      - run: npm ci
      - run: npm run check
      - name: Bake Google Desktop OAuth client
        shell: bash
        env:
          GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
        run: node scripts/bake-google-desktop-oauth.js
      - name: Ad hoc sign and verify macOS ARM64 bundle without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --arm64 --publish never
      # Ad hoc distribution does not promise notarization or unattended installation.
      # Integrity errors block publication; policy rejection is reported for manual installation.
      - name: Verify final macOS integrity and report platform trust
        run: node scripts/verify-release-macos.js
      # Uses the existing secret NAME only when an authorized release runs.
      # Never log it, persist it to disk, or accept a public-root env override.
      - name: Sign final macOS archive manifest
        env:
          MORROW_UPDATE_SIGNING_KEY: ${{ secrets.MORROW_UPDATE_SIGNING_KEY }}
        run: node scripts/sign-release-manifest.js
      - name: Stage macOS assets and provenance
        run: node scripts/prepare-release-assets.js --platform macos --output staging/release-macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: staging/release-macos/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: staging/release-windows
      # Publication begins only after both builds and manifest authentication.
      # Publisher verifies provenance and paired assets before promoting a draft.
      - name: Publish and verify paired release
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-release.js');
            await publish({ github, context, artifactDirectory: 'staging' });
