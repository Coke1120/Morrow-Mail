name: Controlled native mailbox latency evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mailbox-latency.yml'
      - 'windows/Checks/MailboxLatency.cpp'
      - 'scripts/windows-mailbox-latency.py'
      - 'scripts/test-windows-mailbox-latency.py'
      - 'scripts/mailbox-acceptance.py'
      - 'scripts/test-mailbox-acceptance.py'
      - 'macos/Checks/MailboxLatency.swift'
permissions:
  contents: read
concurrency:
  group: mailbox-latency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  winui-measurement:
    name: WinUI event/layout evidence validity
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Preserve repository source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Measure the submitted source so independent protocol/native stages
          # can share one manifest while the stacked base continues to move.
          # Normal native/security CI still checks the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check synthetic adapter and evidence contracts
        shell: pwsh
        run: |
          python -X utf8 -B scripts/test-mailbox-acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/test-windows-mailbox-latency.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build private fixture and measure actual WinUI actions
        shell: pwsh
        run: python -X utf8 -B scripts/windows-mailbox-latency.py --output "$env:RUNNER_TEMP/mailbox-latency-windows"
      - name: Report bounded measurement diagnostics
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'mailbox-latency-windows'
          $receiptPath = Join-Path $evidenceRoot 'evidence.json'
          if ((Test-Path -LiteralPath $receiptPath -PathType Leaf) -and (Get-Item -LiteralPath $receiptPath).Length -le 1048576) {
            try {
              $receipt = Get-Content -LiteralPath $receiptPath -Raw -Encoding utf8 | ConvertFrom-Json
              $failure = [string]$receipt.error
              [ordered]@{
                status = $(if ($receipt.status -in @('complete', 'failed')) { $receipt.status } else { 'invalid' })
                exitCode = $(if ($receipt.exitCode -is [long] -or $receipt.exitCode -is [int]) { $receipt.exitCode } else { $null })
                nativeProcessExitCode = $(if ($receipt.nativeProcessExitCode -is [long] -or $receipt.nativeProcessExitCode -is [int]) { $receipt.nativeProcessExitCode } else { $null })
                sourceCommit = $(if ([string]$receipt.source.commit -cmatch '^[0-9a-f]{40}$') { $receipt.source.commit } else { 'invalid' })
                sourceDigest = $(if ([string]$receipt.source.digest -cmatch '^[0-9a-f]{64}$') { $receipt.source.digest } else { 'invalid' })
                sourceAfterDigest = $(if ([string]$receipt.sourceAfter.digest -cmatch '^[0-9a-f]{64}$') { $receipt.sourceAfter.digest } else { 'invalid' })
                error = $failure.Substring(0, [Math]::Min($failure.Length, 1024))
                errorTruncated = $failure.Length -gt 1024
              } | ConvertTo-Json -Compress
            } catch { Write-Output 'Measurement receipt could not be decoded; retained artifact is authoritative.' }
          } else { Write-Output 'Measurement receipt is missing or oversized.' }
          foreach ($name in @('native-build.log', 'native.log')) {
            $logPath = Join-Path $evidenceRoot $name
            if (-not (Test-Path -LiteralPath $logPath -PathType Leaf)) { continue }
            if ((Get-Item -LiteralPath $logPath).Length -gt 16777216) {
              Write-Output "$name exceeds the diagnostic read bound; retained artifact is authoritative."
              continue
            }
            $diagnosticMatches = @(Select-String -LiteralPath $logPath -Encoding utf8 -Pattern 'fatal error|error [A-Z]+[0-9]+|error:|failed|failure|exception' | Select-Object -First 41)
            Write-Output "$name matchingLinesShown=$([Math]::Min($diagnosticMatches.Count, 40)) additionalMatches=$($diagnosticMatches.Count -gt 40)"
            foreach ($diagnosticMatch in ($diagnosticMatches | Select-Object -First 40)) {
              $diagnosticLine = $diagnosticMatch.Line
              Write-Output ("{0}:{1}: {2}" -f $name, $diagnosticMatch.LineNumber, $diagnosticLine.Substring(0, [Math]::Min($diagnosticLine.Length, 1024)))
            }
          }
      - name: Retain evidence, adapters and measured binary identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mailbox-latency-windows
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mailbox-latency-windows/*.json
            ${{ runner.temp }}/mailbox-latency-windows/*.log
            ${{ runner.temp }}/mailbox-latency-windows/*.exe
            ${{ runner.temp }}/mailbox-latency-windows/*.dll
            ${{ runner.temp }}/mailbox-latency-windows/compiler-inputs/windows/*.cpp
            ${{ runner.temp }}/mailbox-latency-windows/compiler-inputs/windows/*.h
  appkit-measurement:
    name: AppKit event/layout evidence validity
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check synthetic evidence contracts
        run: python3 -B scripts/test-mailbox-acceptance.py
      - name: Build private fixture and measure actual AppKit actions
        run: python3 -B scripts/mailbox-acceptance.py run-native-macos --output "$RUNNER_TEMP/mailbox-latency-macos"
      - name: Retain evidence, adapter and measured binary identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mailbox-latency-macos
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mailbox-latency-macos/*.json
            ${{ runner.temp }}/mailbox-latency-macos/*.log
            ${{ runner.temp }}/mailbox-latency-macos/mailbox-native-latency
            ${{ runner.temp }}/mailbox-latency-macos/compiler-inputs/AppModel.swift
