[package]
name = "morrow-search"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "functions", "backup", "collation"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
unicode-normalization = "=0.1.25"
regex = "1"
zeroize = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["full"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.12"
subtle = "2"
percent-encoding = "2"
icu_collator = "=2.3.1"
icu_locale = "2"
ammonia = "4"
html2text = "0.16"
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"
imap-proto = "0.16"

ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
flate2 = "1"
libc = "0.2"
iana-time-zone = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[build-dependencies]
serde_json = "=1.0.151"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
